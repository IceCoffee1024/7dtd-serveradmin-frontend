name: Locale Parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/locale-parity.yml
      - package.json
      - scripts/check-locales.mjs
      - 'src/locales/**/*.json'
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/locale-parity.yml
      - package.json
      - scripts/check-locales.mjs
      - 'src/locales/**/*.json'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check locale parity
        run: node scripts/check-locales.mjs
